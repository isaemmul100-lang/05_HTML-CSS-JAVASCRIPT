<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>폼 입력값과 변경 이벤트 읽기</title>
    <style>
      #log {
        background: #f4f4f4;
        padding: 12px;
        min-height: 4em;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <!-- 문제 05. 폼 입력값과 변경 이벤트 읽기
       유형 : 코드 작성 | 난이도 : ★★☆

       [1] 소개를 입력하는 즉시 글자 수를 갱신한다. '안녕'을 입력하면 '2자'가 표시된다.
       [2] 관심 분야를 변경하면 '분야 : JavaScript' 형식으로 출력한다.
       [3] 수신 동의 체크박스를 켜고 끄면 각각 '수신 동의 : true', '수신 동의 : false'를 출력한다.
       [4] '전체 확인'을 클릭하면 현재 소개, 선택한 학습 방식, 관심 분야, 수신 동의 여부를 한 줄씩 출력한다.
  -->

    <h1>폼 입력값과 변경 이벤트 읽기</h1>
    <p>
      <label>소개 <textarea id="bio"></textarea></label>
      <output id="count">0자</output>
    </p>
    <form id="settings">
      <fieldset>
        <legend>학습 방식</legend>
        <label
          ><input type="radio" name="mode" value="온라인" checked />
          온라인</label
        >
        <label
          ><input type="radio" name="mode" value="오프라인" /> 오프라인</label
        >
      </fieldset>
      <p>
        <label
          >분야
          <select name="topic">
            <option>HTML</option>
            <option>JavaScript</option>
          </select></label
        >
      </p>
      <p>
        <label><input type="checkbox" name="subscribe" /> 수신 동의</label>
      </p>
      <button type="button" id="read">전체 확인</button>
    </form>
    <h2>실행 결과</h2>
    <pre id="log" aria-live="polite"></pre>

    <script>
      const $log = document.getElementById("log");

      function log(message) {
        $log.textContent += message + "\n";
      }

      const $bio = document.getElementById("bio");
      const $count = document.getElementById("count");
      const $settings = document.getElementById("settings");

      // TODO [1] input 이벤트로 글자 수 표시
      $bio.addEventListener("input", (e) => {
        $count.textContent = `${e.target.value.length}자`;
      });
      // TODO [2, 3] change 이벤트로 변경 내용 출력
      $settings.topic.addEventListener("change", (e) => {
        $log.textContent = "";
        log(`분야 : ${e.target.value}`);
      });

      $settings.subscribe.addEventListener("change", (e) => {
        $log.textContent = "";
        log(`수신 동의 : ${e.target.checked}`);
      });
      // TODO [4] 폼 요소의 value와 checked 읽기
      const $read = document.getElementById("read");
      $read.addEventListener("click", () => {
        $log.textContent = "";
        log(`소개 : ${$bio.value}`);
        log(`학습 방식 : ${$settings.mode.value}`);
        log(`분야 : ${$settings.topic.value}`);
        log(`수신 동의 : ${$settings.subscribe.checked}`);
      });
    </script>
  </body>
</html>
