<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>이벤트 핸들러 제거하기</title>
    <style>
      #log {
        background: #f4f4f4;
        padding: 12px;
        min-height: 4em;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <!-- 문제 02. 이벤트 핸들러 제거하기
       유형 : 코드 수정 | 난이도 : ★★☆

       [1] 먼저 '기록'을 누르고 '기록 중지'를 누른 뒤 다시 '기록'을 눌러 본다.
           같은 내용의 함수를 넘겼는데도 이벤트가 제거되지 않는 이유를 적는다.
       [2] 제거 코드를 고쳐 중지 후에는 '클릭 기록'이 추가되지 않게 한다.
       [3] '한 번만' 버튼에 once 옵션을 사용한다. 여러 번 눌러도 '한 번 실행'은 한 줄만 출력한다.
  -->

    <h1>이벤트 핸들러 제거하기</h1>
    <button type="button" id="record">기록</button>
    <button type="button" id="stop">기록 중지</button>
    <button type="button" id="once">한 번만</button>
    <h2>실행 결과</h2>
    <pre id="log" aria-live="polite"></pre>

    <script>
      const $log = document.getElementById("log");

      function log(message) {
        $log.textContent += message + "\n";
      }

      const $record = document.getElementById("record");

      function recordClick() {
        log("클릭 기록");
      }

      $record.addEventListener("click", recordClick);
      document.getElementById("stop").addEventListener("click", () => {
        // TODO [1, 2] 원인을 적고 제거 코드 수정
        // 원인 : record의 버튼에서 사용한 함수는 recordClick함수이다 그래서 화살표 함수와는 다른 함수로 인식되어 제거 안됨
        $record.removeEventListener("click", recordClick);
      });

      // TODO [3] '한 번만' 버튼의 이벤트 등록
      document.getElementById("once").addEventListener(
        "click",
        () => {
          log("한 번 실행");
        },
        { once: true },
      );
    </script>
  </body>
</html>
