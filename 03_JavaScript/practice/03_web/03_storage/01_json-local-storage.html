<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 목록을 새로고침 후 복원하기</title>
  <style>
    #log { background: #f4f4f4; padding: 12px; min-height: 4em; white-space: pre-wrap; }
  </style>
</head>
<body>
  <!-- 문제 01. 할 일 목록을 새로고침 후 복원하기
       유형 : 코드 작성 | 난이도 : ★★★

       이 파일은 Live Server로 열어 같은 주소에서 저장과 새로고침을 확인한다.
       [1] loadTasks에서 키가 없으면 빈 배열을 반환하고, 값이 있으면 JSON.parse로 배열을 복원한다.
       [2] saveTasks에서 배열을 JSON 문자열로 바꿔 localStorage에 저장한다.
       [3] 할 일을 추가하고 새로고침해도 목록이 남아야 한다. '초기화'를 누르면 이 실습 키만 삭제하고 목록을 비운다.
           기대 : '운동'을 추가하고 새로고침 → 목록에 '운동' / 초기화 후 새로고침 → 빈 목록.
  -->

  <h1>할 일 목록을 새로고침 후 복원하기</h1>
  <form id="taskForm">
    <label>할 일 <input name="task"></label>
    <button type="submit">추가</button>
    <button type="button" id="reset">초기화</button>
  </form>
  <ul id="tasks"></ul>
  <h2>실행 결과</h2>
  <pre id="log" aria-live="polite"></pre>

  <script>
    const $log = document.getElementById("log");

    function log(message) {
      $log.textContent += message + "\n";
    }

    const STORAGE_KEY = "practice.03_web.tasks";
    const $taskForm = document.getElementById("taskForm");
    const $tasks = document.getElementById("tasks");

    function loadTasks() {
      // TODO [1] 저장된 목록을 불러오기
      return []; // 연습을 시작할 때 사용할 임시 반환값
    }

    function saveTasks(tasks) {
      // TODO [2] 현재 목록을 JSON 문자열로 저장
    }

    function render(tasks) {
      $tasks.replaceChildren();
      for (const task of tasks) {
        const $item = document.createElement("li");
        $item.textContent = task;
        $tasks.append($item);
      }
      log(`할 일 ${tasks.length}개`);
    }

    let tasks = loadTasks();
    render(tasks);

    $taskForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const $input = $taskForm.elements.task;
      const text = $input.value.trim();
      if (!text) return;
      tasks.push(text);
      saveTasks(tasks);
      render(tasks);
      $taskForm.reset();
    });

    document.getElementById("reset").addEventListener("click", () => {
      // TODO [3] 이 실습의 저장 키를 삭제하고 빈 배열을 렌더링
    });
  </script>
</body>
</html>
