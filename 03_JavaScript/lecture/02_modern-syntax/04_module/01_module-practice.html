<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>모듈 실행해보기</h1>
    <div id="output"></div>

    <!-- JavaScript에서 import를 사용하기 위해 -->
    <!-- 
    script type=module
    ES모듈로 실행하라고 브라우저에 알려주는 표시
    import / export 사용 가능
     -->
    <script type="module">
      //   import { PI, add, internalNote } from "./math.js"; // import 부터 internalNote 이거는 불가 : export처리를 안 했기 때문
      // 이름 내보내기 : 중괄호로 가져오고 이름이 일치해야한다.
      import { PI, add, subtract } from "./math.js";

      // default export : 중괄호가 없이, 이름을 마음대로

      import sayHello, { LANG } from "./greeting.js";

      // 화면에 출력할 요소를 선택
      const output = document.getElementById("output");

      // 결과를 담을 배열
      const result = [
        `PI = ${PI}`,
        `add(3,4) = ${add(3, 4)}`,
        `sayHello('홍길동') = ${sayHello("홍길동")}`,
        `LANG = ${LANG}`
      ];

      result.forEach((line) => {
        const p = document.createElement("p"); // HTML 요소 만들기
        p.textContent = line;
        // output 요소에 p 태그 추가
        output.appendChild(p);
        console.log(`요소추가: ${line}`);
      });

      //   console.log(`internalNote : ${internalNote}`);

      //   var modulerVar = "이 변수는 이 모듈 안에서만 유효"; // 모듈 스코프를 가진다

      //   console.log(window.modulerVar);
    </script>
  </body>
</html>
